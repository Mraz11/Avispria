# Aircraft and camera profiles. Every value states its source; `verified = false`
# means it has not yet been confirmed on real hardware for this project.
# Confirm camera values from an original photo with:  avispria camera-from-photo

[lito-x1]
name = "DJI Lito X1"
camera_model = "FC9589"        # EXIF Model of the founder's Lito X1 photos (verified)
max_speed_ms = 12.0            # DJI Fly SPEEDCapability.json for waypoint missions (verified)
drone_enum = 68                # observed in a DJI Fly mission from a Lito X1 (verified)
waypoint_limit = 99            # conservative; a secondary source claims 200 (unverified)
verified = true                # geometry from EXIF of original DNGs; timing still to measure
notes = "FC9589 1/1.3-inch 48 MP, electronic (rolling) shutter. Sensor size from EXIF focal 6.72 mm and 35 mm-equivalent 24 mm (CIPA diagonal definition). Waypoint speed 0.1-12 m/s, gimbal -90..+40 from DJI Fly capability files."

[lito-x1.modes.12mp]
sensor_width_mm = 9.692        # from EXIF (FocalLength 6.72, FocalLengthIn35mmFormat 24)
sensor_height_mm = 7.269
focal_mm = 6.72                # EXIF FocalLength (verified)
image_width_px = 4032          # 12 MP mode is 2x2 binned 48 MP; dimensions per DJI spec
image_height_px = 3024
min_interval_s = 2.0           # assumed; measure with a probe flight
readout_s = 0.03               # OpenDroneMap default for unknown cameras

[lito-x1.modes.48mp]
sensor_width_mm = 9.692
sensor_height_mm = 7.269
focal_mm = 6.72
image_width_px = 8064          # verified from DNG full-resolution SubIFD
image_height_px = 6048
min_interval_s = 5.0           # assumed; measure with a probe flight
readout_s = 0.03

[mini-4-pro]
name = "DJI Mini 4 Pro"
camera_model = "FC8482"
max_speed_ms = 16.0            # retailer spec listing
drone_enum = 68                # FlyPath: verified from a native RC 2 mission dump
waypoint_limit = 99
verified = false
notes = "Camera FC8482. Geometry from a published calibration profile."

[mini-4-pro.modes.12mp]
sensor_width_mm = 8.974
sensor_height_mm = 6.717
focal_mm = 6.72
image_width_px = 4032
image_height_px = 3024
min_interval_s = 2.0
readout_s = 0.03

[mini-4-pro.modes.48mp]
sensor_width_mm = 8.974
sensor_height_mm = 6.717
focal_mm = 6.72
image_width_px = 8064
image_height_px = 6048
min_interval_s = 5.0
readout_s = 0.03
