exclude: ^(LICENSE|uv\.lock)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # latest as of 2026-10-26; bump with `uv run pre-commit autoupdate`
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-toml

  # Local hooks use the exact tool versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy-core
        name: mypy (core, strict)
        entry: uv run mypy src/avispria/core
        language: system
        pass_filenames: false
        files: ^src/avispria/core/
